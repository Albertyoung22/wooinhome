<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>管理員登入 ｜ 窩在家包租代管 CRM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body style="background: #1c1a17; display: flex; align-items: center; justify-content: center; min-height: 100vh;">
  <div style="width: 420px; max-width: 90vw; background: #ffffff; border-radius: 12px; padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); border-top: 5px solid #b89158;">
    <div style="text-align: center; margin-bottom: 28px;">
      <div style="width: 50px; height: 50px; background: #1c1a17; color: #b89158; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; margin-bottom: 12px; border: 1px solid #b89158;">窩</div>
      <h2 style="font-family: var(--font-serif); font-size: 22px; margin-bottom: 6px;">窩在家 CRM 業務後台</h2>
      <p style="font-size: 13px; color: #777;">HMAC 企業級安全驗證登入</p>
    </div>

    {% if error %}
    <div style="background: #fed7d7; color: #9b2c2c; padding: 12px; border-radius: 6px; font-size: 13px; margin-bottom: 20px;">
      ⚠️ {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/admin/login">
      <div class="form-group">
        <label class="form-label">管理員帳號 (Username)</label>
        <input type="text" name="username" class="form-control" placeholder="預設：admin" required autofocus>
      </div>

      <div class="form-group" style="margin-bottom: 28px;">
        <label class="form-label">管理密碼 (Password)</label>
        <input type="password" name="password" class="form-control" placeholder="預設：admin888" required>
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; padding: 14px; font-size: 15px;">
        🔐 安全登入後台系統
      </button>
    </form>

    <div style="margin-top: 24px; text-align: center;">
      <a href="/" style="font-size: 13px; color: #888;">← 返回窩在家官方網站首頁</a>
    </div>
  </div>
</body>
</html>
