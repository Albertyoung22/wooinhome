services:
  - type: web
    name: wooinhome-platform
    env: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: admin888
      - key: GITHUB_BACKUP_BRANCH
        value: cloud-backup
      - key: KEEP_ALIVE_INTERVAL
        value: 600
